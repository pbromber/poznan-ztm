# Example configuration.yaml entries

# Poznań Public Transport is configured via the UI
# Go to Settings -> Devices & Services -> Add Integration
# Search for "Poznań Public Transport"

# Example automation
automation:
  - alias: "Bus 171 arriving in 5 minutes"
    trigger:
      - platform: state
        entity_id: sensor.niedziałkowskiego_next_departure
    condition:
      - condition: template
        value_template: "{{ state_attr('sensor.niedziałkowskiego_next_departure', 'minutes') == 5 }}"
      - condition: template
        value_template: "{{ state_attr('sensor.niedziałkowskiego_next_departure', 'line') == '171' }}"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "Bus Alert"
          message: "Bus 171 arriving in 5 minutes!"

  - alias: "Morning commute notification"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "Morning Bus Schedule"
          message: >
            Next departures:
            {{ state_attr('sensor.niedziałkowskiego_all_departures', 'departures')[0].line }} 
            in {{ state_attr('sensor.niedziałkowskiego_all_departures', 'departures')[0].minutes }} minutes

